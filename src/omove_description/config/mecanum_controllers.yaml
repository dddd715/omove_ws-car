controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    front_left_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    front_right_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    rear_left_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    rear_right_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

front_left_velocity_controller:
  ros__parameters:
    joints: [front_left_wheel_joint]

front_right_velocity_controller:
  ros__parameters:
    joints: [front_right_wheel_joint]

rear_left_velocity_controller:
  ros__parameters:
    joints: [rear_left_wheel_joint]

rear_right_velocity_controller:
  ros__parameters:
    joints: [rear_right_wheel_joint]
